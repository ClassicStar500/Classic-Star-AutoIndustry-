<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    text-align:center;
}

h2{
    color:#0f2027;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:13px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    border:2px solid #009688;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    background:#009688;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#00796B;
}

#error{
    color:red;
    margin-top:15px;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:14px;
}
</style>

<script>
// اگر پہلے سے لاگ اِن ہے تو سیدھا index.html پر بھیج دو
if(localStorage.getItem("adminLogin")==="true"){
    window.location.replace("index.html");
}

function login(){

    let username=document.getElementById("username").value.trim();
    let password=document.getElementById("password").value.trim();

    // اپنا Username اور Password یہاں تبدیل کر سکتے ہیں
    const ADMIN_USER="admin";
    const ADMIN_PASS="123456";

    if(username===ADMIN_USER && password===ADMIN_PASS){

        localStorage.setItem("adminLogin","true");

        window.location.replace("index.html");

    }else{

        document.getElementById("error").innerHTML="Invalid Username or Password";

    }

}
</script>

</head>

<body>

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="text"
id="username"
placeholder="Enter Username">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<p id="error"></p>

<div class="footer">
Classic Star Auto Industry<br>
<b>Development by M.Muzammil K</b>
</div>

</div>

</body>
</html>
