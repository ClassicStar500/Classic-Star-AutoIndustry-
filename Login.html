<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.login-box{
width:350px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
text-align:center;
}

h2{
margin-bottom:20px;
color:#0f2027;
}

input{
width:100%;
padding:13px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:13px;
background:#009688;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#00796B;
}

#error{
margin-top:15px;
color:red;
font-weight:bold;
}

.footer{
margin-top:20px;
font-size:13px;
color:#666;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>

<div class="footer">
Classic Star Auto Industry<br>
<b>Development by M.Muzammil K</b>
</div>

</div>

<script>

function login(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="admin" && pass==="123456"){

localStorage.setItem("adminLogin","true");

window.location.href="index.html";

}else{

document.getElementById("error").innerHTML="Invalid Username or Password";

}

}

</script>

</body>
</html>
